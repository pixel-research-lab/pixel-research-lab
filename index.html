<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#254737"><title>픽셀 연구실 · 나의 연구실</title>
<link rel="stylesheet" href="./assets/styles/style.css">
<link rel="stylesheet" href="./assets/styles/calendar.css">
<link rel="manifest" href="./app.webmanifest">
<link rel="icon" href="./assets/images/icon-192.png">
<link rel="apple-touch-icon" href="./assets/images/icon-192.png"></head>
<body><header class="top"><div class="navwrap"><div class="brand"><img class="brand-art" src="./assets/images/mascot.png" width="23" height="21" alt="">픽셀 연구실</div><nav aria-label="메인 메뉴"><button id="home-tab" aria-current="page">연구실</button><button id="journal-tab">연구 일지</button><button data-do="save-panel">세이브 관리</button></nav><button id="account-open" class="account-open" data-do="account">로그인</button><span id="save-state" class="save-dot" role="status">이 브라우저에 저장</span></div></header>
<main><section id="home"><div class="titlebar"><div><div class="eyebrow"><span class="mark">✦</span> Research Lab</div><h1>나의 연구실<span class="dot">.</span></h1><button class="textbtn" id="field-button" data-do="field">연구 분야 설정</button></div><button class="primary" data-do="new"><b aria-hidden="true">＋</b> 퀘스트 등록</button></div>
<div class="layout"><section class="panel room"><div class="paneltop"><h2><span class="lamp-dot"></span>작업 책상</h2><button class="textbtn" data-do="desk">책상 꾸미기 <span aria-hidden="true">↗</span></button></div><div class="roomframe"><canvas id="room-art" width="360" height="166" role="img" aria-label="창가의 픽셀 연구실과 작업 책상"></canvas><button class="wall-calendar" data-plan="wall" aria-label="벽 캘린더 열기" title="벽 캘린더"></button><div id="monitor-notes" aria-label="오늘 일정 포스트잇"></div><button class="desk-clock" data-do="focus-clock" aria-label="탁상시계 · 출퇴근 기록 열기" title="출퇴근 기록"></button><button class="desk-speaker" data-do="music" aria-label="책상 스피커 · YouTube 홈 열기" title="YouTube 홈 열기"><span></span></button></div><div class="attendance" aria-label="출퇴근 기록">
<div class="time-readout"><span class="clock-label">오늘 연구 시간</span><strong id="study-total" role="timer" aria-live="off">00:00:00</strong></div>
<div class="shift-controls"><span id="shift-status">출근 전</span><div class="shift-buttons">
<button class="primary" id="shift-main" data-do="shift" data-arg="start">연구 시작</button>
<button class="secondary" id="shift-out" data-do="shift" data-arg="finish" hidden>퇴근 · 저장</button>
</div></div></div><div class="roomfoot"><span>장식 슬롯</span><div id="desk-summary"></div></div></section>
<div class="right-stack"><section class="panel agenda"><div class="paneltop"><h2>오늘 할 일</h2><span id="agenda-date"></span></div>
<div class="agenda-body"><div id="agenda-today"></div><div class="agenda-actions"><button class="textbtn" data-plan="new-today">＋ 일정 추가</button><button class="textbtn" data-plan="wall">달력 열기 ↗</button></div>
<h3 class="agenda-star-title">★ 중요한 일정</h3><div id="agenda-important"></div></div></section>
<section class="panel board"><div class="paneltop"><h2>오늘의 퀘스트</h2><span class="tiny-counter" id="active-counter"></span></div><div id="quest-board"><div id="schedule-quests" class="board-inner" hidden></div><div id="research-quests"></div><div id="daily-review-quests" class="board-inner"></div></div>
<div class="paneltop review-heading"><h2>복습 관리</h2><button class="textbtn" data-do="new-review">＋ 복습 등록</button></div>
<div id="review-board"></div></section></div></div>
<div class="more"><section class="panel"><div class="paneltop"><h2>스킬 수첩</h2><span class="small muted">독립 단계 이상 스킬 수</span></div><div id="skills"></div></section><section class="panel"><div class="paneltop"><h2>전리품 서랍</h2><span class="tiny-counter" id="loot-count"></span></div><div id="loot"></div></section></div></section>
<section id="journal" hidden><div class="titlebar"><div><div class="eyebrow"><span class="mark">✦</span> FIELD NOTES</div><h1>연구 일지<span class="dot">.</span></h1></div><button data-do="new" class="primary">＋ 퀘스트 등록</button></div><section class="panel"><div class="paneltop"><h2>완료한 연구</h2><span class="tiny-counter" id="done-count"></span></div><div id="journal-rows"></div></section>
<section class="panel review-archive"><div class="paneltop"><h2>완료한 복습</h2><span class="tiny-counter" id="review-count"></span></div><div id="review-records"></div></section>
<section class="panel attendance-log"><div class="paneltop"><h2>출퇴근 기록</h2><span class="small muted">최근 7일 · 기기 현지 시간</span></div><div id="shift-log"></div></section></section>
<footer id="offline-status" class="offline-status" role="status" hidden></footer></main>
<dialog id="modal"><div class="modalbar"><span id="dialog-context"></span><button class="closebtn" aria-label="창 닫기" id="close-modal">×</button></div><div id="modal-body"></div></dialog><div id="toast" role="status" aria-live="polite"></div>
<script src="./src/data.js"></script><script src="./src/art.js"></script><script src="./src/attendance.js"></script><script src="./src/reviews.js"></script><script src="./src/calendar.js"></script><script src="./src/planner.js"></script><script src="./src/transfer.js"></script><script src="./dist/cloud-account.js"></script><script src="./src/app.js"></script><script src="./src/offline.js"></script><script src="./src/visits.js"></script></body></html>
