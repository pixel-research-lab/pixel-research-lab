<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>픽셀 연구실 · 알림 연결</title>
<style>*{box-sizing:border-box}body{font:16px/1.6 system-ui;background:#f5f0df;color:#234338;max-width:490px;margin:24px auto;padding:18px}input,button{font:inherit;padding:8px}input{width:100%}button{background:#355e47;color:white;border:0;margin-top:12px}small{overflow-wrap:anywhere}</style>
<h1>Slack 알림 연결</h1><p>이 연구실에 새 글이 올라온 채널이나 DM을 보낸 사람의 이름을 표시합니다.</p><small id="site"></small>
<form id="pair"><label>수신기 설정에 표시된 연결 코드<input id="code" required autocomplete="off" autocapitalize="none" spellcheck="false"></label><button>이 창에 연결</button></form><p id="status" role="status"></p>
<script>
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.hash.slice(1)),site=params.get('origin')||'',nonce=params.get('nonce')||'';
history.replaceState(null,'',location.pathname);
const allowed=site==='https://pixel-research-lab.github.io'||/^https:\/\/pixel-research-lab-2e2guk(?:--[a-z0-9-]+)?\.web\.app$/.test(site)||/^http:\/\/127\.0\.0\.1:\d+$/.test(site);
const target=window.opener;let key='',timer;
$('site').textContent=site;
if(!allowed || !target || !/^[a-f0-9-]{36}$/i.test(nonce)){
 $('pair').hidden=true;$('status').textContent='픽셀 연구실의 컴퓨터 → 수신기 연결에서 열어 주세요.';
}
async function update(){
 if(!target||target.closed){key='';window.close();return;}
 try{
  const resp=await fetch('/events',{headers:{Authorization:'Bearer '+key},cache:'no-store'});
  if(!resp.ok){key='';$('pair').hidden=false;$('status').textContent='설정 화면에서 현재 연결 코드를 확인해 주세요.';return;}
  const {rows,connected}=await resp.json();
  target.postMessage({type:'pixel-notices',nonce,rows,connected},site);
  $('pair').hidden=true;$('code').value='';
  $('status').textContent=connected?'Slack 알림을 받고 있어요. 이 창을 최소화해도 돼요.':'연구실과 연결됐어요. 수신기 설정에서 Slack 연결을 마치세요.';
 }catch{$('status').textContent='수신기 연결을 다시 시도하는 중이에요.';}
 if(key)timer=setTimeout(update,4000);
}
$('pair').onsubmit=e=>{e.preventDefault();if(!allowed||!target)return;clearTimeout(timer);key=$('code').value.trim();update();};
</script></html>
